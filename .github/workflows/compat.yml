# Compatibility matrix (docs/compatibility.md): the adapters against the pinned framework versions, weekly and on
# demand. A red run here means a framework changed its tool contract — update the adapter or the matrix level.
name: compat
on:
  schedule: [{ cron: "0 7 * * 1" }]
  workflow_dispatch:
  pull_request:
    paths: ["packages/sdk-ts/src/adapters/**", "python/mnki/adapters/**", "docs/compatibility.md"]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e "python[signing]" "openai-agents==0.22.*" "langchain-core==1.6.*" "pydantic-ai-slim==0.1.*"
      - run: pip install "crewai==0.80.*" || echo "crewai pin unavailable on this Python — subclass path skipped"
      - run: cd python && python -W ignore -m unittest tests.test_adapters tests.test_pipeline tests.test_guard tests.test_conformance_l2
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund "@openai/agents@0.1" "@langchain/core@0.3" "ai@5" "@anthropic-ai/claude-agent-sdk@0.1"
      - run: npx vitest run packages/sdk-ts/tests/adapters.test.ts
