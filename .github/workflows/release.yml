# Release on a version tag: git tag v0.1.0 && git push origin v0.1.0
#   npm packages  — trusted publishing (OIDC, no token): configure each package's Trusted Publisher on npmjs.com
#                   as MNKIAgentOS/agent-trust · release.yml · environment `release`. npm mints a short-lived
#                   token from the job's OIDC identity and attaches a provenance attestation automatically.
#                   A package must exist before its Trusted Publisher can be configured, so the very first
#                   publish of a NEW package name is done once from a maintainer's machine (`npm publish`, 2FA).
#                   NPM_TOKEN is honoured if the `release` environment happens to carry one (bootstrap escape
#                   hatch only — npm is restricting 2FA-bypass tokens: accounts Aug 2026, publishing Jan 2027).
#   PyPI `mnki`   — trusted publishing (no token) with attestations
#   artefacts     — CycloneDX SBOM per package, SHA-256 checksums, signed keyless with cosign; attached to the GitHub release
name: release
on:
  push:
    tags: ["v*"]
  # Manual run: re-publish the MCP Registry entry for an already released version (the other jobs stay off).
  workflow_dispatch:
    inputs:
      version: { description: "Released version to (re)publish to the MCP Registry, e.g. 0.1.2", required: true }
permissions:
  contents: write
  id-token: write
jobs:
  npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      # No `registry-url`: setup-node would write an .npmrc pinned to NODE_AUTH_TOKEN, which is empty on the
      # OIDC path and stops trusted publishing from authenticating. npmjs.org is the default registry anyway.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 22 is older.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run sbom
      - name: Publish (dependency order)
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc; echo "publishing with NPM_TOKEN (bootstrap path)"
          else
            echo "publishing with trusted publishing (OIDC)"
          fi
          for p in packages/verifier packages/sdk-ts packages/mcp packages/cli; do
            [ -d "$p" ] || continue
            name=$(node -p "require('./$p/package.json').name"); version=$(node -p "require('./$p/package.json').version")
            # Re-runs after a partial release must not fail on what is already out there.
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already on the registry — skipping"; continue; fi
            (cd "$p" && npm publish --access public) || { echo "::error::publish failed for $name — configure its Trusted Publisher on npmjs.com (repo MNKIAgentOS/agent-trust, workflow release.yml, environment release), or publish the first version manually once"; exit 1; }
          done
      - name: Checksums + signatures
        run: |
          mkdir -p release; for p in packages/*; do n=$(basename "$p"); (cd "$p" && npm pack --silent >/dev/null && mv *.tgz "../../release/$n.tgz" && cp sbom.cdx.json "../../release/$n.sbom.cdx.json"); done
          (cd release && sha256sum * > SHA256SUMS)
      - uses: sigstore/cosign-installer@v3
      - run: cd release && cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: release, path: release }
  pypi:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd python && python -m pip install --upgrade build && python -m unittest discover -s tests && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist, attestations: true, skip-existing: true }
  # Claude Desktop extension: a self-contained bundle (manifest + the published npm package and its runtime deps),
  # packed with Anthropic's mcpb tool and attached to the GitHub release. Users double-click it; Claude Desktop
  # asks for the upstream command, agent id and API key and keeps the key in its keychain.
  mcpb:
    if: github.event_name == 'push'
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # The tarballs the npm job packed: installing from them needs no registry round-trip, so the job cannot race
      # npm's replication (v0.1.2 failed that way while the packages were already published).
      - uses: actions/download-artifact@v4
        with: { name: release, path: release }
      - name: Bundle
        run: |
          set -e; version="${GITHUB_REF_NAME#v}"; name=$(node -p "require('./packages/mcp/package.json').name")
          mkdir -p bundle release-mcpb; cp packages/mcp/mcpb/manifest.json packages/mcp/mcpb/icon.png bundle/
          cd bundle; printf '{ "name": "%s-extension", "version": "%s", "private": true }\n' "$name" "$version" > package.json
          if ! npm install --omit=dev --no-audit --no-fund ../release/verifier.tgz ../release/sdk-ts.tgz ../release/mcp.tgz; then
            echo "tarball install failed, falling back to the registry"
            for i in $(seq 1 20); do npm install --omit=dev --no-audit --no-fund "$name@$version" && break; echo "waiting for $name@$version on npm"; sleep 30; done
          fi
          [ -f "node_modules/$name/dist/main.js" ] || { echo "::error::$name@$version did not install"; exit 1; }
          npx --yes @anthropic-ai/mcpb pack . "../release-mcpb/$name.mcpb"
          cd .. && ls -la release-mcpb
      - uses: actions/upload-artifact@v4
        with: { name: mcpb, path: release-mcpb }
  # MCP Registry (registry.modelcontextprotocol.io): the io.github.* namespace authenticates with this repository's
  # GitHub OIDC token, and npm ownership is proven by the `mcpName` field in the published package.json.
  mcp-registry:
    if: always() && (github.event_name == 'workflow_dispatch' || needs.npm.result == 'success')
    needs: npm
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Publish server.json
        env: { INPUT_VERSION: "${{ inputs.version }}" }
        run: |
          set -e; version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          cd packages/mcp && node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("server.json","utf8"));const v=process.argv[1];j.version=v;for(const p of j.packages??[])p.version=v;fs.writeFileSync("server.json",JSON.stringify(j,null,2)+"\n")' "$version"
          # The registry checks the package on npm; a version published seconds ago may not have replicated yet.
          for i in $(seq 1 20); do npm view "$(node -p "require('./package.json').name")@$version" version >/dev/null 2>&1 && break; echo "waiting for the package on npm"; sleep 30; done
          ../../mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            out=$(../../mcp-publisher publish 2>&1) && { echo "$out"; exit 0; }
            echo "$out"; echo "$out" | grep -q "duplicate version" && { echo "version already in the registry — nothing to do"; exit 0; }
            echo "registry publish attempt $i failed, retrying in 60 s"; sleep 60
          done
          echo "::error::MCP Registry publish failed — fix packages/mcp/server.json (see the validation error above) or re-run this workflow manually with the version"; exit 1
  github-release:
    if: github.event_name == 'push'
    needs: [npm, pypi, mcpb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release, path: release }
      - uses: actions/download-artifact@v4
        with: { name: mcpb, path: release }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --title "${GITHUB_REF_NAME}" || gh release upload "${GITHUB_REF_NAME}" release/* --clobber
