# Publish the npm packages on a version tag: git tag v0.1.0 && git push origin v0.1.0
# Requires the NPM_TOKEN secret (an npm automation token with publish rights on the scope).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish (verifier → sdk → cli)
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::NPM_TOKEN secret is not set"; exit 1; }
          for p in verifier sdk-ts cli; do (cd packages/$p && npm publish --provenance --access public); done
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || true
