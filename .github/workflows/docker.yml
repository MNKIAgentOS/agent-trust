# Container image for the local MCP proxy, signed keyless with cosign: ghcr.io/mnkiagentos/mnki-mcp:<tag>
name: docker
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The default buildx driver cannot produce provenance/SBOM attestations; the container driver can.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with: { context: ., file: packages/mcp/Dockerfile, push: true, tags: "ghcr.io/mnkiagentos/mnki-mcp:${{ github.ref_name }},ghcr.io/mnkiagentos/mnki-mcp:latest", provenance: true, sbom: true }
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "ghcr.io/mnkiagentos/mnki-mcp@${{ steps.build.outputs.digest }}"
