# Supply-chain checks on every push and weekly: dependency review, npm/pip/Go vulnerability audits.
# Secret scanning and push protection are enabled on the repository (GitHub-native).
name: security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]
permissions:
  contents: read
  pull-requests: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pip-audit && cd python && pip-audit --strict --desc on . || true
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: cd go && go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
