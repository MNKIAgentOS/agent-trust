[project]
name = "mnki"
version = "0.1.0"
description = "mnki — the Agent Trust SDK for Python: give an AI agent an identity, verify its authority with evidence, delegate, attest, sign requests (Agent-Proof)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "agent-security", "authorization", "delegation", "mcp", "a2a", "authzen", "spiffe"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Topic :: Security"]

[project.urls]
Homepage = "https://mnki.com"
Repository = "https://github.com/MNKIAgentOS/agent-trust"

[project.optional-dependencies]
signing = ["cryptography>=42"]
httpx = ["httpx>=0.27"]
openai-agents = ["openai-agents>=0.1"]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
pydantic-ai = ["pydantic-ai>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mnki", "mnki.adapters", "agent_trust"]
